name: Backfill HARTI history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create harti_pdfs folder
        run: mkdir -p harti_pdfs

      - name: Download 3 years of HARTI PDFs
        run: python harti_backfill.py

      - name: Delete old harti_data.json so fresh rebuild from PDFs only
        run: rm -f harti_data.json

      - name: Build harti_data.json from downloaded PDFs
        run: python harti_update.py --no-download

      - name: Commit all data
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add harti_data.json harti_pdfs/ || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "HARTI backfill — 3 years history ($(date +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin main
          fi
