function setLang(l){
  const d=CONTENT[l];if(!d)return;
  document.querySelectorAll(".lang-bar button").forEach(b=>{
    b.classList.toggle("on",b.textContent.trim()===({si:"සිංහල",en:"English",ta:"தமிழ்"}[l]));
  });
  document.getElementById("pageTitle").innerHTML=d.title;
  document.getElementById("metaDate").textContent=d.date;
  document.getElementById("mainContent").innerHTML=d.html;
  document.getElementById("navLink").textContent=d.navLink;
  document.documentElement.lang=l;
}
