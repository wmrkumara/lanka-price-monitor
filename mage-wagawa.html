 guide:[
  ["මුලින්ම උදාහරණය බලන්න","\"👀 උදාහරණය බලන්න\" ඔබන්න. තක්කාලි වගා දෙකක් හා මිරිස් වගාවක් සැබෑ වගේ දත්ත සමඟ පෙන්වයි. වාර්තාව බලලා, පස්සේ \"🗑️ උදාහරණ මකන්න\" ඔබන්න."],
  ["ඔබේ වගාව එකතු කරන්න","\"➕ අලුත් වගාවක්\" ඔබලා දඹුල්ල ලැයිස්තුවෙන් බෝගය තෝරන්න. වගා කළ දිනය, අක්කර ගණන හා බලාපොරොත්තු අස්වැන්න දාන්න. සමහර ඒවා නැතත් පටන් ගන්න පුළුවන්. \"🎯 අයවැය\" ඔබලා වියදම් සැලසුම් කර බලාපොරොත්තු ලාභය කලින්ම බලන්න."],
  ["හැම වියදමක්ම එදාම ලියන්න","\"➖ වියදමක්\" ඔබලා මුදල හා සටහන ලියන්න. සටහනේ 'පොහොර', 'පැළ', 'ලොරිය' වගේ වචනයක් තිබුණොත් වර්ගය තේරෙනවා. වැරදි නම් වෙනස් කරන්න. ඔබට ඕන වර්ගය ලැයිස්තුවේ නැත්නම් \"➕ අලුත් වර්ගයක් එකතු කරන්න\" තෝරන්න."],
  ["වැඩ පැය","\"⏱️ වැඩ පැය\" ඔබන්න. කුලී කම්කරුවන්: පුද්ගලයන් × පැය × පැයකට කුලිය වියදමට එකතු වෙනවා. ඔබේ / පවුලේ පැය වෙනම ගණන් ගන්නවා, වියදමට එකතු වෙන්නේ නැහැ."],
  ["විකුණන හැම වතාවකම","\"➕ විකුණුමක්\" ඔබලා ප්‍රමාණය, මිල හා කාටද කියලා ලියන්න. එදා දඹුල්ල මිල උදව්වට පෙන්වයි."],
  ["අද දඹුල්ල මිල කොටුව","ඉතිරි අස්වැන්න අද දඹුල්ල මිලට විකුණුවොත් මුළු ලාභය කීයද කියලා කොළ පාට කොටුවේ පෙන්වයි."],
  ["📊 වාර්තාව බලන්න","ප්‍රධාන කරුණු, මුදල් ගියේ කොහෙද, සැලසුම vs ඇත්ත, මාසෙන් මාසෙට, කාටද විකුණුවේ, කලින් වගාවට සාපේක්ෂව — සේරම එක තැනක. PDF කරලා බැංකුවට හෝ පවුලට පෙන්වන්න පුළුවන්."],
  ["මාසයකට වරක් Backup","දත්ත ෆෝන් එකේ පමණයි. \"💾 Backup ගොනුවක් බාගන්න\" ඔබලා Google Drive හෝ WhatsApp එකේ තබාගන්න. අලුත් ෆෝන් එකේ \"📂 Backup එකක් ඇතුළත් කරන්න\"."]
 ]

function guessCat(note){const s=(note||"").toLowerCase();let best=null,pos=1e9;
  for(const id in KW)for(const w of KW[id]){const i=s.indexOf(w.toLowerCase());if(i>=0&&i<pos){pos=i;best=id;}}return best;}

/* ================= STORAGE + MIGRATION ================= */
const posNum=v=>{v=parseFloat(v);return isFinite(v)&&v>0?v:0;};
function migrateCrop(c){
  c.exp=Array.isArray(c.exp)?c.exp:[];c.inc=Array.isArray(c.inc)?c.inc:[];c.work=Array.isArray(c.work)?c.work:[];
  c.plan=c.plan&&typeof c.plan==="object"?c.plan:{};
  if(OLD_SEASON[c.season])c.season=OLD_SEASON[c.season];if(!['yala','maha','other',''].includes(c.season||''))c.season='';
  if(!['kg','nut','bundle'].includes(c.unit))c.unit='kg';c.expQty=posNum(c.expQty);c.expPrice=posNum(c.expPrice);c.ownRate=posNum(c.ownRate);c.area=posNum(c.area)?String(posNum(c.area)):'';
  if(c.item!=null&&!/^\d{1,4}$/.test(String(c.item)))c.item=null;if(typeof c.e!=='string'||c.e.length>8)c.e='🌿';
  for(const k in c.plan){if(!/^[a-z0-9]{1,20}$/.test(k)||!(posNum(c.plan[k])>0))delete c.plan[k];}
  c.exp=c.exp.filter(x=>x&&posNum(x.amt)>0);c.inc=c.inc.filter(x=>x&&posNum(x.qty)>0&&parseFloat(x.price)>=0);c.work=c.work.filter(x=>x&&posNum(x.hours)>0);
  c.exp.forEach(x=>{if(!isCat(x.cat)){const i=OLD_CATS.indexOf(x.cat);x.cat=i>=0?CAT_IDS[i]:"other";}
    if(x.cat==="other"&&!x.fixed){const g=guessCat(x.note);if(g)x.cat=g;x.fixed=1;}});
  c.work.forEach(x=>{if(!TASK_IDS.includes(x.task)){const i=OLD_TASKS.indexOf(x.task);x.task=i>=0?TASK_IDS[i]:"other";}});
  if(!c.id)c.id=Date.now()+Math.random();
  return c;
}

  if(!Array.isArray(DB.crops))DB.crops=[];if(!Array.isArray(DB.customCats))DB.customCats=[];DB.customCats=DB.customCats.filter(cc=>cc&&/^c\d{6,16}$/.test(String(cc.id))).map(cc=>({id:cc.id,name:String(cc.name||"").replace(/[<>&"]/g,"").slice(0,40)}));DB.crops.forEach(migrateCrop);}

/* ================= DAMBULLA PRICES ================= */
async function getJSON(n){for(const u of["https://raw.githubusercontent.com/wmrkumara/lanka-price-monitor/main/"+n+"?t="+Date.now(),n+"?t="+Date.now()]){try{const r=await fetch(u,{cache:"no-store"});if(r.ok)return await r.json();}catch(e){}}return null;}
async function loadPrices(){
  const [db,early,items]=await Promise.all([getJSON("dambulla_dec.json"),getJSON("dambulla_early.json"),getJSON("dambulla_items.json")]);
  if(items)NAMES=items.items||{};
  DAYS=Object.assign({},(db&&db.days)||{});
  if(early&&early.date&&early.prices&&!DAYS[early.date]){const k=Object.keys(DAYS).sort();if(!k.length||early.date>k[k.length-1])DAYS[early.date]=early.prices;}
  DK=Object.keys(DAYS).sort();if(DK.length){PDATE=DK[DK.length-1];PRICES=DAYS[PDATE];}
  fillItems();render();
}
function itemName(k){const m=NAMES[k];return m?(m[LG]||m.si):null;}
function fillItems(){
  const cur=$("fItem").value;
  const opts=Object.entries(NAMES).sort((a,b)=>a[1].pop-b[1].pop).map(([k,m])=>`<option value="${k}">${m.e||"🌿"} ${esc(m[LG]||m.si)}</option>`).join("");
  $("fItem").innerHTML=`<option value="">${T("pick")}</option>`+opts;$("fItem").value=cur;
}
function todayRange(c){const v=c.item&&PRICES[c.item];return v?{lo:v[0],hi:v[1]}:null;}
/* Dambulla price on a date (or the nearest earlier day within 7 days) */
function priceOn(item,date){if(!item||!DK.length||!date)return null;
  for(let i=DK.length-1;i>=0;i--){const d=DK[i];if(d<=date){if((new Date(date)-new Date(d))/864e5>7)return null;const v=DAYS[d][item];return v?{lo:v[0],hi:v[1],d}:null;}}return null;}
function displayName(c){const m=c.item&&NAMES[c.item];let n=(m&&(!c.name||c.name===m.si))?(m[LG]||m.si):(c.name||"—");return n+(c.demo?" ("+T("demoTag")+")":"");}

/* ================= MATHS ================= */
function totals(c){
  const W=c.work||[],wcost=w=>(+w.people||1)*(+w.hours||0)*(+w.rate||0),whrs=w=>(+w.people||1)*(+w.hours||0);
  const hired=W.filter(w=>w.who==="hired").reduce((s,w)=>s+wcost(w),0);
  const hiredH=W.filter(w=>w.who==="hired").reduce((s,w)=>s+whrs(w),0);
  const ownH=W.filter(w=>w.who!=="hired").reduce((s,w)=>s+whrs(w),0),ownV=ownH*(+c.ownRate||0);
  const byCat={};c.exp.forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+(+x.amt||0));if(hired)byCat.labour=(byCat.labour||0)+hired;
  const cost=c.exp.reduce((s,x)=>s+(+x.amt||0),0)+hired,inc=c.inc.reduce((s,x)=>s+(+x.qty||0)*(+x.price||0),0),qty=c.inc.reduce((s,x)=>s+(+x.qty||0),0);
  const left=c.expQty?Math.max(0,c.expQty-qty):null,be=c.expQty?cost/c.expQty:null,ac=parseFloat(c.area)||0;
  const byMonth={},addM=(d,k,v)=>{if(!d)return;const m=d.slice(0,7);byMonth[m]=byMonth[m]||{cost:0,inc:0};byMonth[m][k]+=v;};
  c.exp.forEach(x=>addM(x.date,"cost",+x.amt||0));W.filter(w=>w.who==="hired").forEach(w=>addM(w.date,"cost",wcost(w)));c.inc.forEach(x=>addM(x.date,"inc",(+x.qty||0)*(+x.price||0)));
  const byTask={};W.forEach(w=>{const t=byTask[w.task]=byTask[w.task]||{own:0,hired:0,cost:0};if(w.who==="hired"){t.hired+=whrs(w);t.cost+=wcost(w);}else t.own+=whrs(w);});
  return {cost,inc,qty,left,be,prof:inc-cost,hired,hiredH,ownH,ownV,ac,byCat,byMonth,byTask,avg:qty?inc/qty:null};
}

$("sCrop").onchange=()=>{CUR=+$("sCrop").value;salePh();};
$("qExp").onclick=()=>openSheet("tExp");$("qInc").onclick=()=>openSheet("tInc");$("sheetClose").onclick=closeSheet;$("sheetBg").onclick=closeSheet;
$("tWork").onclick=()=>{tab("tWork");whoHint();};

  $("wRate").disabled=own;if(own)$("wRate").value="";$("wHint").textContent=own?T("hintOwn"):T("hintHired");}

  if(!(h>0)){alert(T("needHours"));return;}if(!own&&!(r>0)){alert(T("needRate"));return;}

    fillCats(id);$("catHint").textContent=T("catAdded",n);}
  else $("catHint").textContent="";
  sel.dataset.prev=sel.value;CAT_TOUCHED=true;};
$("addExp").onclick=()=>{const a=parseFloat($("eAmt").value);if(!(a>0)){alert(T("needAmt"));return;}
  if($("eCat").value==="__new"){alert(T("addCat"));return;}

  $("eAmt").value="";$("eNote").value="";$("catHint").textContent="";CAT_TOUCHED=false;save();render();closeSheet();toast(T("added"));};

  DB.crops.splice(CUR,1);CUR=null;save();show("list");};

/* ================= REPORT PIECES ================= */
function donut(entries,total){
  const sorted=entries.filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
  const top=sorted.length<=8?8:7;const sl=sorted.slice(0,top).map(([id,v])=>({n:catName(id),v}));const rest=sorted.slice(top).reduce((a,[,v])=>a+v,0);if(rest>0)sl.push({n:T("otherSlice"),v:rest});
  const R=70,C=2*Math.PI*R;let acc=0;
  const arcs=sl.map((s,i)=>{const len=s.v/total*C,a=`<circle r="${R}" cx="100" cy="100" fill="none" stroke="${PIE[i]}" stroke-width="34" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"/>`;acc+=len;return a;}).join("");
  return `<div class="donutWrap"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(T("catH"))}">${arcs}<text x="100" y="94" text-anchor="middle" font-size="12" fill="#6f675a">${esc(T("total"))}</text><text x="100" y="116" text-anchor="middle" font-size="15" font-weight="800" fill="#191d1a" font-family="JetBrains Mono,monospace">${money(total)}</text></svg>
  <div class="leg">${sl.map((s,i)=>`<div><i style="background:${PIE[i]}"></i><span>${esc(s.n)}</span><span class="v">${money(s.v)} <span class="note">${pct(s.v,total)}%</span></span></div>`).join("")}</div></div>`;
}
function hbar(lbl,v,max,color){return `<div class="hb"><span>${lbl}</span><div class="tr"><div class="fl" style="width:${max?Math.max(0,Math.min(100,Math.abs(v)/max*100)):0}%;background:${color}"></div></div><span class="v ${v<0?"neg":""}">${money(v)}</span></div>`;}
function prevCrop(c){
  return DB.crops.filter(x=>x!==c&&!!x.demo===!!c.demo&&(c.item?x.item===c.item:displayName(x)===displayName(c))&&(x.start||"")<(c.start||"")).sort((a,b)=>(b.start||"").localeCompare(a.start||""))[0];
}

function renderReport(){
  const c=DB.crops[CUR];if(!c){show("list");return;}const t=totals(c),u=unitName(c.unit);
  let h=`<div class="card"><div class="row noprint" style="justify-content:space-between"><button class="btn" type="button" data-act="crop">${T("rBack")}</button><button class="btn" type="button" data-act="print">${T("rPrint")}</button></div>
    <button class="btn big noprint" type="button" data-act="pdf" data-src="vReport" style="width:100%;justify-content:center;margin-top:10px;background:#0f7a4f;border-color:#0f7a4f;color:#fff">${T("sharePdf")}</button>
    <p class="note noprint" style="margin:8px 0 0">${T("rHint")}</p>
    <h2 style="font-size:22px;margin:12px 0 0">${T("rTitle")}: ${esc(c.e||"🌿")} ${esc(displayName(c))}</h2>
    <p class="note" style="margin:2px 0 0">${T("planted")}${esc(c.start||"—")}${c.season?" · "+T("seasonW",T("seasons")[c.season]):""}${c.area?" · "+T("landAc",esc(c.area)):""}</p></div>`;
  if(!c.exp.length&&!c.inc.length&&!c.work.length){$("vReport").innerHTML=h+`<div class="card note">${T("kpEmpty")}</div>`;return;}

  /* key points */
  const kp=[];const cats=Object.entries(t.byCat).sort((a,b)=>b[1]-a[1]);
  if(cats.length&&t.cost)kp.push(T("kpBig",catName(cats[0][0]),money(cats[0][1]),pct(cats[0][1],t.cost)));
  if(t.inc>0)kp.push(t.prof>=0?T("kpProfit",money(t.prof)):T("kpLoss",money(-t.prof)));else if(t.cost)kp.push(T("growing")+" — "+T("growNote"));
  let dq=0,dm=0,mq=0,mv=0;c.inc.forEach(x=>{const p=priceOn(c.item,x.date);if(p){dq+=+x.qty||0;dm+=(+x.qty||0)*(p.lo+p.hi)/2;mv+=(+x.qty||0)*(+x.price||0);}});
  if(dq){const my=mv/dq,da=dm/dq,d=Math.round((my-da)/da*100);if(Math.abs(d)>=1)kp.push(d<0?T("kpPriceLow",money(my),money(da),-d):T("kpPriceHigh",money(my),money(da),d));}
  const r=todayRange(c);if(r&&t.be!=null)kp.push(T("kpBe",money(t.be),money(r.lo),money(r.hi)));
  const over=allCatIds().filter(id=>(+c.plan[id]||0)>0&&(t.byCat[id]||0)>+c.plan[id]).length;if(over)kp.push(T("kpOver",over));
  if(c.expQty&&t.qty)kp.push(T("kpHarvest",Math.min(100,pct(t.qty,c.expQty))));
  if(t.ownH)kp.push(T("kpOwn",num(t.ownH),c.ownRate?money(t.ownV):""));
  h+=`<div class="card"><h2>${T("kpH")}</h2><ul class="kp">${kp.map(k=>`<li>${k}</li>`).join("")}</ul></div>`;

  /* cost / income / profit */
  const mx=Math.max(t.cost,t.inc,Math.abs(t.prof))||1;
  h+=`<div class="card"><h2>${T("sumH")}</h2>${hbar(T("thCost"),t.cost,mx,"#b23a2e")}${hbar(T("thInc"),t.inc,mx,"#2c7a52")}${hbar(T("profitShort"),t.prof,mx,t.prof>=0?"#0e4f4a":"#b23a2e")}</div>`;

  /* where money went */
  if(t.cost>0)h+=`<div class="card"><h2>${T("catH")}</h2>${donut(Object.entries(t.byCat),t.cost)}</div>`;

  /* plan vs actual */
  const pIds=allCatIds().filter(id=>(t.byCat[id]||0)>0||(+c.plan[id]||0)>0);
  let pT=0,aT=0;
  h+=`<div class="card"><h2>${T("planH")}</h2><p class="note noprint" style="margin-top:-4px">${T("planNote")}</p><div class="tw"><table><thead><tr><th>${T("thCat")}</th><th class="n">${T("thPlan")}</th><th class="n">${T("thReal")}</th></tr></thead><tbody>`
   +pIds.map(id=>{const p=+c.plan[id]||0,a=t.byCat[id]||0;pT+=p;aT+=a;const ov=p&&a>p;
     return `<tr><td>${catName(id)}${p?`<div class="pb"><i class="${ov?"over":""}" style="width:${Math.min(100,pct(a,p))}%"></i></div><span class="note ${ov?"neg":""}">${ov?T("overBy",money(a-p)):T("leftBy",money(p-a))}</span>`:""}</td>
     <td class="n"><input class="pin" type="number" inputmode="numeric" min="0" data-cat="${id}" value="${p||""}" placeholder="0" aria-label="${esc(T("thPlan"))}"></td><td class="n ${ov?"neg":""}">${nf(a)}</td></tr>`;}).join("")
   +`<tr><td><b>${T("total")}</b></td><td class="n"><b>${pT?nf(pT):"—"}</b></td><td class="n"><b class="${pT&&aT>pT?"neg":""}">${nf(aT)}</b></td></tr></tbody></table></div></div>`;

  /* month by month */
  const mk=Object.keys(t.byMonth).sort();
  if(mk.length){let run=0;const mm=Math.max(...mk.map(k=>Math.max(t.byMonth[k].cost,t.byMonth[k].inc)))||1;
    h+=`<div class="card"><h2>${T("monthH")}</h2><div class="tw"><table><thead><tr><th>${T("thMonth")}</th><th class="n">${T("thCost")}</th><th class="n">${T("thInc")}</th><th class="n">${T("thRun")}</th></tr></thead><tbody>`
     +mk.map(k=>{const m=t.byMonth[k];run+=m.inc-m.cost;return `<tr><td>${monthLabel(k)}<div class="mb"><i style="width:${pct(m.cost,mm)}%;background:#b23a2e"></i><i style="width:${pct(m.inc,mm)}%;background:#2c7a52"></i></div></td><td class="n neg">${m.cost?nf(m.cost):"—"}</td><td class="n pos">${m.inc?nf(m.inc):"—"}</td><td class="n ${run<0?"neg":"pos"}"><b>${nf(run)}</b></td></tr>`;}).join("")
     +`</tbody></table></div></div>`;}

  /* sales */
  if(c.inc.length){
    const by={};c.inc.forEach(x=>{const k=(x.where||"").trim()||T("unknownBuyer");by[k]=by[k]||{q:0,v:0};by[k].q+=+x.qty||0;by[k].v+=(+x.qty||0)*(+x.price||0);});
    h+=`<div class="card"><h2>${T("salesH")}</h2><div class="tw"><table><thead><tr><th>${T("thBuyer")}</th><th class="n">${T("thQty")}</th><th class="n">${T("thAvg")}</th><th class="n">${T("thInc")}</th></tr></thead><tbody>`
     +Object.entries(by).sort((a,b)=>b[1].v-a[1].v).map(([k,o])=>`<tr><td>${esc(k)}</td><td class="n">${num(o.q)} ${u}</td><td class="n">${nf(o.v/o.q)}</td><td class="n pos">${nf(o.v)}</td></tr>`).join("")
     +`</tbody></table></div>`;
    const withP=c.inc.map(x=>({x,p:priceOn(c.item,x.date)})).filter(o=>o.p).sort((a,b)=>(a.x.date||"").localeCompare(b.x.date||""));
    if(withP.length)h+=`<h3 style="margin-top:14px">${T("vsDamH")}</h3><div class="tw"><table><thead><tr><th>${T("thDate")}</th><th class="n">${T("thMy")}</th><th class="n">${T("thDam")}</th><th class="n">${T("thDiff")}</th></tr></thead><tbody>`
      +withP.map(({x,p})=>{const mid=(p.lo+p.hi)/2,d=Math.round((x.price-mid)/mid*100);return `<tr><td style="white-space:nowrap">${esc(x.date)}</td><td class="n">${nf(x.price)}</td><td class="n">${nf(p.lo)}–${Math.round(p.hi).toLocaleString("en-US")}</td><td class="n ${d<0?"neg":"pos"}">${d>0?"+":""}${d}%</td></tr>`;}).join("")
      +`</tbody></table></div>`;
    h+=`</div>`;}

  /* work hours */
  const tk=Object.keys(t.byTask);
  if(tk.length)h+=`<div class="card"><h2>${T("workH")}</h2><div class="tw"><table><thead><tr><th>${T("thTask")}</th><th class="n">${T("thOwnH")}</th><th class="n">${T("thHiredH")}</th><th class="n">${T("thHiredC")}</th></tr></thead><tbody>`
    +tk.map(k=>{const o=t.byTask[k];return `<tr><td>${taskName(k)}</td><td class="n">${o.own?num(o.own):"—"}</td><td class="n">${o.hired?num(o.hired):"—"}</td><td class="n">${o.cost?nf(o.cost):"—"}</td></tr>`;}).join("")
    +`<tr><td><b>${T("total")}</b></td><td class="n"><b>${num(t.ownH)}</b></td><td class="n"><b>${num(t.hiredH)}</b></td><td class="n"><b>${nf(t.hired)}</b></td></tr></tbody></table></div></div>`;

  /* compare with earlier crop */
  const p=prevCrop(c);
  if(p){const q=totals(p),pu=unitName(p.unit);
    const rowsC=[[T("thCost"),nf(t.cost),nf(q.cost)],[T("thInc"),nf(t.inc),nf(q.inc)],[T("sProf"),`<span class="${t.prof>=0?"pos":"neg"}">${nf(t.prof)}</span>`,`<span class="${q.prof>=0?"pos":"neg"}">${nf(q.prof)}</span>`],
      [T("mYield"),num(t.qty)+" "+u,num(q.qty)+" "+pu],[T("mAvg"),t.avg!=null?nf(t.avg):"—",q.avg!=null?nf(q.avg):"—"],[T("mPU"),t.qty?nf(t.prof/t.qty):"—",q.qty?nf(q.prof/q.qty):"—"],
      [T("mCA"),t.ac?nf(t.cost/t.ac):"—",q.ac?nf(q.cost/q.ac):"—"],[T("mPA"),t.ac?nf(t.prof/t.ac):"—",q.ac?nf(q.prof/q.ac):"—"]];
    const lbl=(p.season?T("seasons")[p.season]+", ":"")+(p.start||"").slice(0,7);
    h+=`<div class="card"><h2>${T("cmpH",esc(lbl))}</h2><div class="tw"><table><thead><tr><th></th><th class="n">${T("thThis")}</th><th class="n">${T("thPrev")}</th></tr></thead><tbody>`
     +rowsC.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td></tr>`).join("")+`</tbody></table></div></div>`;}
  else h+=`<div class="card note">${T("noPrev")}</div>`;

  $("vReport").innerHTML=h;
  $("vReport").querySelectorAll(".pin").forEach(inp=>inp.onchange=()=>{const v=parseFloat(inp.value)||0;if(v>0)c.plan[inp.dataset.cat]=v;else delete c.plan[inp.dataset.cat];save();const y=window.scrollY;renderReport();window.scrollTo({top:y});});
}

/* ---- budget (crop plan) ---- */
function renderBudget(){
  const c=DB.crops[CUR];if(!c){show("list");return;}const t=totals(c),u=unitName(c.unit),r=todayRange(c),mid=r?Math.round((r.lo+r.hi)/2):0;
  const ids=allCatIds();let P=0;ids.forEach(id=>P+=(+c.plan[id]||0));
  const price=c.expPrice||mid,EI=c.expQty&&price?c.expQty*price:0,EP=EI-P;
  let h=`<div class="card"><div class="row noprint" style="justify-content:space-between"><button class="btn" type="button" data-act="crop">${T("bBack")}</button><button class="btn" type="button" data-act="print">${T("rPrint")}</button></div>
   <h2 style="font-size:22px;margin:12px 0 4px">${T("bTitle")}</h2><p class="note" style="margin:0 0 4px">${esc(c.e||"🌿")} ${esc(displayName(c))}</p><p class="note" style="margin:0">${T("bIntro")}</p></div>`;
  h+=`<div class="card"><div class="sum"><div><span>${T("bPlanned")}</span><b>${nf(P)}</b></div><div><span>${T("bExpInc")}</span><b class="pos">${EI?nf(EI):"—"}</b></div><div><span>${T("bExpProf")}</span><b class="${EP>=0?"pos":"neg"}">${EI?nf(EP):"—"}</b></div></div>
   ${P?`<div class="sbar"><i style="width:${Math.min(100,pct(t.cost,P))}%;background:${t.cost>P?"var(--up)":"var(--petrol)"}"></i></div><p class="note" style="margin:5px 0 12px">${T("bSpentAll",pct(t.cost,P))}</p>`:""}
   <label for="bPrice">${T("bPriceL")}</label><input id="bPrice" class="noprint" type="number" inputmode="decimal" min="0" value="${c.expPrice||""}" placeholder="${mid?esc(T("bPricePh",mid)):""}">
   <p class="note" style="margin:6px 0 0">${c.expQty?(EI?`${num(c.expQty)} ${u} × ${money(price)} ${c.expPrice?"":T("bByToday")}`:""):T("bNeedExp")}</p></div>`;
  h+=`<div class="card"><h2>${T("bLimitsH")}</h2><p class="note" style="margin-top:-4px">${T("bLimitsNote")}</p>`+ids.map(id=>{const pl=+c.plan[id]||0,a=t.byCat[id]||0,ov=pl&&a>pl;
     return `<div style="display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee5d3"><div><b style="font-size:15px">${catName(id)}</b><div class="note">${T("bSpent",money(a))}${pl?` · <span class="${ov?"neg":""}">${ov?T("overBy",money(a-pl)):T("leftBy",money(pl-a))}</span>`:""}</div>${pl?`<div class="pb"><i class="${ov?"over":""}" style="width:${Math.min(100,pct(a,pl))}%"></i></div>`:""}</div>
     <input class="bin pin" type="number" inputmode="numeric" min="0" data-cat="${id}" value="${pl||""}" placeholder="0" aria-label="${esc(T("thPlan"))}" style="width:120px"></div>`;}).join("")+`</div>`;
  $("vBudget").innerHTML=h;
  const keep=f=>{save();const y=window.scrollY;renderBudget();window.scrollTo({top:y});};
  $("bPrice").onchange=()=>{c.expPrice=Math.max(0,parseFloat($("bPrice").value)||0);keep();};
  $("vBudget").querySelectorAll(".bin").forEach(inp=>inp.onchange=()=>{const v=parseFloat(inp.value)||0;if(v>0)c.plan[inp.dataset.cat]=v;else delete c.plan[inp.dataset.cat];keep();});
}

/* ---- all crops ---- */
let ALLF="all",ALLD=null;
function renderAll(){
  const both=realCrops().length&&hasDemo();if(!both)ALLD=null;else if(ALLD===null)ALLD="mine";
  const list=DB.crops.filter(c=>(ALLF==="all"||c.season===ALLF)&&(!both||(ALLD==="demo")===!!c.demo));
  let h=`<div class="card"><div class="row noprint" style="justify-content:space-between"><button class="btn" type="button" data-act="list">${T("listBack")}</button><button class="btn" type="button" data-act="print">${T("rPrint")}</button></div>
   <button class="btn big noprint" type="button" data-act="pdf" data-src="vAll" style="width:100%;justify-content:center;margin-top:10px;background:#0f7a4f;border-color:#0f7a4f;color:#fff">${T("sharePdf")}</button>
   <h2 style="font-size:22px;margin:12px 0 8px">${T("allT")}</h2><div class="row noprint">${["all","yala","maha","other"].map(s=>`<button class="btn ${ALLF===s?"solid":""}" type="button" data-f="${s}">${s==="all"?T("fAll"):T("seasons")[s]}</button>`).join("")}</div>${both?`<div class="row noprint" style="margin-top:8px">${[["mine",T("fMine")],["demo",T("fDemo")]].map(([k,l])=>`<button class="btn ${ALLD===k?"gold":""}" type="button" data-d="${k}">${l}</button>`).join("")}</div>`:""}</div>`;
  let C=0,I=0;const byCat={};
  const rows=list.map(c=>{const t=totals(c);C+=t.cost;I+=t.inc;for(const k in t.byCat)byCat[k]=(byCat[k]||0)+t.byCat[k];
    return `<tr><td>${esc(c.e||"🌿")} ${esc(displayName(c))}<div class="note">${esc(c.start||"")}${c.season?" · "+T("seasons")[c.season]:""}</div></td><td class="n neg">${nf(t.cost)}</td><td class="n pos">${nf(t.inc)}</td><td class="n">${t.inc>0||!t.cost?`<b class="${t.prof>=0?"pos":"neg"}">${nf(t.prof)}</b>`:`<span class="grow">🌱</span>`}</td></tr>`;}).join("");
  h+=`<div class="card"><div class="tw"><table class="tight"><thead><tr><th>${T("thCrop")}</th><th class="n">${T("thCost")}</th><th class="n">${T("thInc")}</th><th class="n">${T("profitShort")}</th></tr></thead><tbody>${rows}

/* ================= PDF SHARE ================= */
function loadScript(u){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${u}"]`))return ok();const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function sharePdf(src,btn){
  if(btn.disabled)return;const old=btn.innerHTML;btn.disabled=true;btn.innerHTML=T("pdfMaking");
  let wrap;
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    /* build a clean A4-width copy off screen */
    wrap=document.createElement("div");
    wrap.style.cssText="position:fixed;left:-10000px;top:0;width:560px;background:#f4efe4;padding:18px;font-family:'Noto Sans Sinhala','Noto Sans Tamil',sans-serif";
    const head=document.createElement("div");head.className="card";
    head.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b style="font-size:20px;color:#0e4f4a">🌾 ${esc(T("title").replace("🌾","").trim())} — TopGoviya.lk</b><span class="note">${today()}</span></div>`;
    wrap.appendChild(head);
    const body=$(src).cloneNode(true);body.removeAttribute("id");body.classList.remove("hide");
    body.querySelectorAll(".noprint").forEach(e=>e.remove());
    body.querySelectorAll("input.pin").forEach(i=>{const sp=document.createElement("span");sp.textContent=i.value?nf(+i.value):"—";sp.style.fontFamily="JetBrains Mono,monospace";i.replaceWith(sp);});
    while(body.firstChild)wrap.appendChild(body.firstChild);
    const foot=document.createElement("p");foot.className="note";foot.innerHTML=T("disc")+"<br>"+T("pdfBy")+" "+today()+" · topgoviya.lk/mage-wagawa.html";foot.style.margin="14px 0 0";const lastCard=[...wrap.children].reverse().find(e=>e.classList.contains("card"));(lastCard||wrap).appendChild(foot);
    document.body.appendChild(wrap);
    const scale=2.5,canvas=await html2canvas(wrap,{scale,backgroundColor:"#f4efe4",useCORS:true,logging:false});
    /* split pages between cards, never through the middle of one if it fits */
    const W=canvas.width,pageH=Math.floor(W*297/210),blocks=[...wrap.children].map(el=>({top:el.offsetTop*scale,bottom:(el.offsetTop+el.offsetHeight)*scale}));
    const cuts=[0];let start=0;
    for(const bl of blocks){if(bl.bottom-start>pageH){if(bl.top>start){start=bl.top-8*scale;cuts.push(start);}while(bl.bottom-start>pageH){start+=pageH;cuts.push(start);}}}
    cuts.push(canvas.height);
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:"mm",format:"a4"});
    for(let i=0;i<cuts.length-1;i++){const h=Math.min(cuts[i+1],canvas.height)-cuts[i];if(h<=4)continue;
      const pc=document.createElement("canvas");pc.width=W;pc.height=h;const cx=pc.getContext("2d");cx.fillStyle="#f4efe4";cx.fillRect(0,0,W,h);cx.drawImage(canvas,0,cuts[i],W,h,0,0,W,h);
      if(i>0)pdf.addPage();pdf.setFillColor(244,239,228);pdf.rect(0,0,210,297,"F");pdf.addImage(pc.toDataURL("image/jpeg",0.85),"JPEG",0,0,210,h*210/W);}
    const c=DB.crops[CUR],nm=(src==="vReport"&&c?displayName(c):"all-crops").replace(/[^\p{L}\p{M}\p{N}]+/gu,"-").replace(/^-|-$/g,"");
    const file=new File([pdf.output("blob")],`TopGoviya-${nm}-${today()}.pdf`,{type:"application/pdf"});
    let shared=false;
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:file.name});shared=true;}catch(e){if(e&&e.name==="AbortError")shared=true;}}
    if(!shared){const u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);toast(T("pdfSaved"));}
  }catch(e){console.error(e);alert(T("pdfFail"));}
  finally{if(wrap)wrap.remove();btn.disabled=false;btn.innerHTML=old;}
}

function backupBlob(){return new Blob([JSON.stringify({crops:realCrops(),customCats:customCats()},null,1)],{type:"application/json"});}
async function shareFile(){const name="mage-wagawa-backup-"+today()+".json";
  try{const f=new File([backupBlob()],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});DB.lastBackup=today();save();render();return;}}catch(e){if(e&&e.name==="AbortError")return;}
  exportFile();}
function exportFile(){const out={crops:realCrops(),customCats:customCats()},b=new Blob([JSON.stringify(out,null,1)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="mage-wagawa-backup-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);DB.lastBackup=today();save();render();}
function importFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.crops))throw new Error("format");
  if(Array.isArray(d.customCats))d.customCats.forEach(cc=>{if(cc&&/^c\d{6,16}$/.test(String(cc.id))&&!isCat(cc.id))DB.customCats.push({id:cc.id,name:String(cc.name||"").replace(/[<>&"]/g,"").slice(0,40)});});fillCats();
  const ids=new Set(DB.crops.map(c=>c.id));let n=0;d.crops.forEach(c=>{if(!ids.has(c.id)){DB.crops.push(migrateCrop(c));n++;}});save();render();alert(T("imported",n));}catch(err){alert(T("badFile"));}};r.readAsText(f);e.target.value="";}
