function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function sing(w){
  if(w.length<=3) return w;
  if(/ies$/.test(w)) return w.slice(0,-3)+'y';
  if(/oes$/.test(w)) return w.slice(0,-2);
  if(/(ss|us)$/.test(w)) return w;
  if(/s$/.test(w)) return w.slice(0,-1);
  return w;
}
function norm(s){
  s=String(s||'').toLowerCase().replace(/[​-‍﻿]/g,'');
  s=s.replace(/ූ/g,'ු');               /* ූ and ු treated the same (ලූණු / ලුණු) */
  s=s.replace(/['’`]/g,'');
  s=s.replace(/([a-z0-9])([඀-෿])/g,'$1 $2').replace(/([඀-෿])([a-z0-9])/g,'$1 $2');
  s=s.replace(/[^a-z0-9඀-෿]+/g,' ').trim();
  return s.split(' ').map(function(w){return /^[a-z]+$/.test(w)?sing(w):w;}).join(' ');
}
function isSi(s){return /[඀-෿]/.test(s);}
function lev(a,b){
  var m=a.length,n=b.length,i,j,prev=[],cur;
  for(j=0;j<=n;j++)prev[j]=j;
  for(i=1;i<=m;i++){cur=[i];for(j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}prev=cur;}
  return prev[n];
}

/* Build the search index once the product list is known */
function buildIndex(products){
  var groups=[],claimed={},auto=[];
  GROUPS.forEach(function(g,gi){
    var ids=g[0].map(String).filter(function(id){return products[id];});
    if(!ids.length) return;
    var grp={ids:ids,si:g[1],en:g[2],unit:g[4]||'kg',aliases:g[3].split(',').map(norm).filter(Boolean)};
    ids.forEach(function(id){
      if(!claimed[id]){claimed[id]=grp; grp.aliases.push(norm(products[id].name));}
    });
    groups.push(grp);
  });
  Object.keys(products).forEach(function(id){
    if(claimed[id]) return;
    var nm=products[id].name;
    var grp={ids:[id],si:nm,en:nm,unit:'kg',aliases:[norm(nm)]};
    groups.push(grp);
  });
  var pairs=[];
  groups.forEach(function(g){
    var seen={};
    g.aliases.forEach(function(a){ if(a && !seen[a]){seen[a]=1; pairs.push({a:a,g:g,si:isSi(a)});} });
  });
  pairs.sort(function(x,y){return y.a.length-x.a.length;});
  return {groups:groups,pairs:pairs};
}

/* Find product groups mentioned in the question (longest alias first, several allowed) */
function matchGroups(query,idx){
  var q=' '+norm(query)+' ', out=[], i, p, pos, len;
  for(i=0;i<idx.pairs.length && out.length<6;i++){
    p=idx.pairs[i];
    if(p.si && p.a.length>3){ pos=q.indexOf(p.a); len=p.a.length; }
    else { pos=q.indexOf(' '+p.a+' '); len=p.a.length; if(pos>=0)pos+=1; }
    if(pos<0) continue;
    q=q.slice(0,pos)+new Array(len+1).join(' ')+q.slice(pos+len);
    if(out.indexOf(p.g)<0) out.push(p.g);
  }
  return out;
}

/* Typo tolerance for English / Singlish words (carot -> carrot) */
function fuzzyList(query,idx,maxDist){
  var toks=norm(query).split(' ').filter(function(t){return /^[a-z]+$/.test(t)&&t.length>=3&&!STOP[t]&&!STOP[t+'s'];});
  var best={},res=[];
  toks.forEach(function(t){
    idx.pairs.forEach(function(p){
      if(p.si||p.a.indexOf(' ')>=0||p.a.length<3) return;
      var lim=Math.min(maxDist,t.length<=4?1:(t.length<=6?1:2));
      if(Math.abs(p.a.length-t.length)>lim) return;
      var d=lev(t,p.a);
      if(d<=lim && (best[p.g.ids.join()]===undefined||d<best[p.g.ids.join()].d)) best[p.g.ids.join()]={d:d,g:p.g};
    });
  });
  Object.keys(best).forEach(function(k){res.push(best[k]);});
  res.sort(function(a,b){return a.d-b.d;});
  return res.map(function(r){return r.g;});
}

/* Prepare the downloaded JSON */
function prepare(raw){
  if(!raw||typeof raw!=='object'||!raw.products||!raw.days||!raw.latest_date) throw new Error('bad-json');
  var dates=Object.keys(raw.days).filter(function(d){return d<=raw.latest_date;}).sort();
  if(!dates.length||!raw.days[raw.latest_date]) throw new Error('bad-json');
  var db={products:raw.products,days:raw.days,dates:dates,latest_date:raw.latest_date,updated_sl:raw.updated_sl||'',source_url:raw.source_url||''};
  db.index=buildIndex(db.products);
  return db;
}
function rangeOf(v){
  if(Array.isArray(v)&&v.length>=2&&isFinite(v[0])&&isFinite(v[1])&&v[0]>0&&v[1]>0) return [+v[0],+v[1]];
  if(typeof v==='number'&&isFinite(v)&&v>0) return [v,v];
  return null;
}
/* Latest price of one product + the previous price before it */
function lastRec(db,id){
  var i,r,cur=null;
  for(i=db.dates.length-1;i>=0;i--){
    var day=db.days[db.dates[i]];
    if(!day||typeof day!=='object') continue;
    r=rangeOf(day[id]);
    if(!r) continue;
    if(!cur){cur={date:db.dates[i],min:r[0],max:r[1]};}
    else return {cur:cur,prev:{date:db.dates[i],min:r[0],max:r[1]}};
  }
  return cur?{cur:cur,prev:null}:null;
}

function detectLang(q){
  if(/[඀-෿]/.test(q)) return 'si';
  if(/\b(mila|mil|kiyada|kiyadha|kiyda|kiyak|mokakda|mokada|eka|eke|ada|dawase|thiyenawada|kohomada|neda|wage|saha|thiyanawada|kiyanna|mata)\b/i.test(q)) return 'si';
  return 'en';
}
function isGreeting(q){
  var n=norm(q);
  if(!n) return true;
  if(/^(hi|hello|hey|help|ayubowan|hii|hy)( |$)/.test(n)) return true;
  if(/^(ආයුබෝවන්|හෙලෝ|කොහොමද|උදව්)/.test(n)) return true;
  return false;
}
function daysBetween(a,b){return Math.round((Date.parse(b)-Date.parse(a))/86400000);}
function fmtRange(a,b){return a===b?('Rs. '+a):('Rs. '+a+'–'+b);}
function chipBtn(text){return '<button type="button" class="cin" data-q="'+esc(text)+'">'+esc(text)+'</button>';}
function label(g,lang){return lang==='si'?g.si:g.en;}

function changeHtml(rec,T){
  if(!rec.prev) return '';
  var m1=(rec.cur.min+rec.cur.max)/2, m0=(rec.prev.min+rec.prev.max)/2, d=Math.round(m1-m0);
  var txt=d===0?('● '+T.same):((d>0?'▲ +':'▼ −')+Math.abs(d));
  return '<span class="c">'+txt+' <small>'+T.vs.replace('%D',esc(rec.prev.date))+'</small></span>';
}
function groupCard(g,db,lang,T){
  var rows='',multi=g.ids.length>1,unitTxt=g.unit==='nut'?T.nut:T.kg,i,id,rec,nm,showName;
  for(i=0;i<g.ids.length;i++){
    id=g.ids[i]; nm=db.products[id].name; rec=lastRec(db,id);
    showName=multi||nm.toLowerCase()!==label(g,lang).toLowerCase();
    var nameDiv=showName?'<div class="n">'+esc(nm)+'</div>':'';
    if(!rec){rows+='<div class="r">'+nameDiv+'<div class="nodata">'+T.noData+'</div></div>';continue;}
    var age=daysBetween(rec.cur.date,db.latest_date);
    if(age>30){rows+='<div class="r">'+nameDiv+'<div class="nodata">'+T.noRecent.replace('%D',esc(rec.cur.date))+'</div></div>';continue;}
    rows+='<div class="r">'+nameDiv+
      '<div class="p">'+fmtRange(rec.cur.min,rec.cur.max)+'<small>/ '+unitTxt+'</small></div>'+(age>0?'':changeHtml(rec,T))+
      (age>0?'<div class="stale">'+T.last+': '+esc(rec.cur.date)+' '+T.oldTag+'</div>':'')+'</div>';
  }
  return '<div class="card"><div class="gh">'+esc(label(g,lang))+'</div>'+rows+'<div class="dt">'+T.dataDate+': '+esc(db.latest_date)+' · '+T.whole+'</div></div>';
}
function helpHtml(T){
  return '<p>'+T.hello+'</p><p class="note">'+T.tryAsk+'</p><p>'+['කැරට් මිල කීයද?','carrot price today','thakkali mila kiyada','බෝංචි, තක්කාලි'].map(chipBtn).join('')+'</p>';
}
function suggestGroups(query,db){
  var f=fuzzyList(query,db.index,2).slice(0,4);
  return f;
}
function buildReply(query,db){
  var lang=detectLang(query),T=I18N[lang],idx=db.index,groups=matchGroups(query,idx),fuzzy=false,html='';
  if(!groups.length){
    if(isGreeting(query)) return {kind:'help',lang:lang,html:helpHtml(T)};
    var f=fuzzyList(query,idx,1);
    if(f.length&&f.length<=2){groups=f.slice(0,2);fuzzy=true;}
  }
  if(!groups.length){
    var sug=suggestGroups(query,db),list,head;
    if(sug.length){head=T.didYou;list=sug.map(function(g){return chipBtn(label(g,lang));});}
    else{head=T.popular;list=CHIPS.map(chipBtn);}
    return {kind:'notfound',lang:lang,html:'<p>'+T.notFound.replace('%Q',esc(query.trim().slice(0,60)))+'</p><p class="note">'+head+'</p><p>'+list.join('')+'</p>'};
  }
  if(fuzzy) html+='<p class="note">'+T.fuzzy+' <b>'+groups.map(function(g){return esc(label(g,lang));}).join(', ')+'</b></p>';
  groups.forEach(function(g){html+=groupCard(g,db,lang,T);});
  html+='<p class="note">'+T.disc+'<br>'+T.more+' <a href="'+SITE_URL+'" target="_blank" rel="noopener">TopGoviya.lk</a></p>';
  return {kind:'price',lang:lang,fuzzy:fuzzy,groups:groups,html:html};
}

(function(){
  if(typeof document==='undefined') return;
  var chat=document.getElementById('chat'),statusEl=document.getElementById('status'),
      form=document.getElementById('f'),input=document.getElementById('q'),
      chipsEl=document.getElementById('chips'),btn=document.getElementById('sendBtn');
  var db=null,pending=null,loadFailed=false,CACHE_KEY='tg_dec_cache_v1';

  var lastStatus={t:'',c:''};
  function setStatus(t,cls){lastStatus={t:t,c:cls||''};statusEl.textContent=t;statusEl.className='status'+(cls?' '+cls:'');}
  function tmpStatus(t,cls){statusEl.textContent=t;statusEl.className='status'+(cls?' '+cls:'');}
  function restoreStatus(){statusEl.textContent=lastStatus.t;statusEl.className='status'+(lastStatus.c?' '+lastStatus.c:'');}
  function addMsg(role,html,isText){
    var d=document.createElement('div');d.className='msg '+role;
    if(isText)d.textContent=html;else d.innerHTML=html;
    chat.appendChild(d);
    while(chat.children.length>60&&chat.removeChild){chat.removeChild(chat.children[0]);}
    chat.scrollTop=chat.scrollHeight;return d;
  }
  function slimForCache(raw){
    var dates=Object.keys(raw.days).sort().slice(-60),days={};
    dates.forEach(function(d){days[d]=raw.days[d];});
    return {products:raw.products,days:days,latest_date:raw.latest_date,updated_sl:raw.updated_sl,source_url:raw.source_url};
  }
  function saveCache(raw){try{localStorage.setItem(CACHE_KEY,JSON.stringify(slimForCache(raw)));}catch(e){}}
  function readCache(){try{var s=localStorage.getItem(CACHE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}

  /* the newest day can be in dambulla_early.json (official list copied by hand before the DEC site has it);
     the website page already uses it, so the bot must too */
  var EARLY_URL='https://raw.githubusercontent.com/wmrkumara/lanka-price-monitor/main/dambulla_early.json';
  function mergeEarly(raw,ear){
    try{
      if(ear&&ear.date&&ear.prices&&raw&&raw.days&&!raw.days[ear.date]&&(!raw.latest_date||ear.date>raw.latest_date)){
        raw.days[ear.date]=ear.prices;raw.latest_date=ear.date;
      }
    }catch(e){}
    return raw;
  }
  function fetchEarly(opts){
    return fetch(EARLY_URL,opts).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  }

  /* download fresh data; the 20-second limit covers the whole download, not just the headers */
  function fetchFresh(){
    var ctl=typeof AbortController!=='undefined'?new AbortController():null;
    var timer=ctl?setTimeout(function(){ctl.abort();},20000):null;
    var opts=ctl?{signal:ctl.signal}:{};
    return fetch(SOURCE_URL,opts)
      .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
      .then(function(raw){
        return fetchEarly(opts).then(function(ear){
          if(timer)clearTimeout(timer);
          raw=mergeEarly(raw,ear);
          var d=prepare(raw);saveCache(raw);return d;
        });
      },function(err){if(timer)clearTimeout(timer);throw err;});
  }

  function answer(text){
    var r=buildReply(text,db);
    addMsg('bot',r.html);
  }
  function ask(text){
    text=(text||'').trim();
    if(!text) return;
    addMsg('user',text,true);
    input.value='';
    if(db){answer(text);return;}
    if(loadFailed){addMsg('bot','<p>'+I18N.si.fail+'</p>');return;}
    pending=text;                                   /* answered as soon as data arrives */
    addMsg('bot','<p>'+I18N.si.loading+'</p>');
  }
  function runPending(){
    if(pending&&db){var t=pending;pending=null;answer(t);}
  }

  form.addEventListener('submit',function(e){e.preventDefault();ask(input.value);});
  chat.addEventListener('click',function(e){var b=e.target.closest?e.target.closest('[data-q]'):null;if(b)ask(b.getAttribute('data-q'));});
  chipsEl.addEventListener('click',function(e){var b=e.target.closest?e.target.closest('[data-q]'):null;if(b)ask(b.getAttribute('data-q'));});
  chipsEl.innerHTML=CHIPS.map(function(c){return '<button type="button" class="chip" data-q="'+esc(c)+'">'+esc(c)+'</button>';}).join('');

  addMsg('bot',helpHtml(I18N.si));

  /* ---- voice search (Chrome / Android; button hidden where the browser has no speech support) ---- */
  var SR=(typeof window!=='undefined')?(window.SpeechRecognition||window.webkitSpeechRecognition):null;
  var micBtn=document.getElementById('micBtn'),langBtn=document.getElementById('langBtn');
  var vLang='si-LK',rec=null,listening=false;
  try{var sv=localStorage.getItem('tg_voice_lang');if(sv==='si-LK'||sv==='en-US')vLang=sv;}catch(e){}
  function showLang(){langBtn.textContent=vLang==='si-LK'?'සිං':'EN';}
  function setVLang(v){vLang=v;showLang();try{localStorage.setItem('tg_voice_lang',v);}catch(e){}}
  if(SR&&micBtn&&langBtn){
    micBtn.hidden=false;langBtn.hidden=false;showLang();
    langBtn.addEventListener('click',function(){setVLang(vLang==='si-LK'?'en-US':'si-LK');});
    micBtn.addEventListener('click',function(){
      if(listening&&rec){try{rec.stop();}catch(e){}return;}
      var failed=false;
      rec=new SR();
      rec.lang=vLang;rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
      rec.onstart=function(){listening=true;micBtn.classList.add('on');tmpStatus(I18N.si.listening,'warn');};
      rec.onresult=function(e){
        var res=e.results[e.results.length-1],alts=[],i;
        for(i=0;i<res.length;i++)alts.push(res[i].transcript);
        if(!res.isFinal){input.value=alts[0]||'';return;}
        var chosen=alts[0]||'';
        if(db){for(i=0;i<alts.length;i++){if(buildReply(alts[i],db).kind==='price'){chosen=alts[i];break;}}}
        input.value='';
        ask(chosen);
      };
      rec.onerror=function(e){
        failed=true;var er=e&&e.error;
        if(er==='aborted')return;
        if(er==='not-allowed'||er==='service-not-allowed')tmpStatus(I18N.si.micDenied,'err');
        else if(er==='no-speech')tmpStatus(I18N.si.noSpeech,'warn');
        else if(er==='network')tmpStatus(I18N.si.micNet,'err');
        else if(er==='language-not-supported'){setVLang('en-US');tmpStatus(I18N.si.langNo,'warn');}
        else tmpStatus(I18N.si.micFail,'err');
        setTimeout(restoreStatus,4000);
      };
      rec.onend=function(){
        listening=false;micBtn.classList.remove('on');
        if(!failed)restoreStatus();
      };
      try{rec.start();}catch(e){tmpStatus(I18N.si.micFail,'err');setTimeout(restoreStatus,4000);}
    });
  }

  /* 1) saved copy first, so the chat works immediately even on a slow connection */
  var cachedRaw=readCache();
  if(cachedRaw){
    try{db=prepare(cachedRaw);setStatus(I18N.si.cached.replace('%D',db.latest_date),'warn');}catch(e){db=null;}
  }
  var urlQ=null;try{urlQ=new URLSearchParams(location.search).get('q');}catch(e){}
  if(urlQ&&db){ask(urlQ);urlQ=null;}

  /* 2) fresh data in the background */
  fetchFresh().then(function(fresh){
    db=fresh;setStatus(I18N.si.loaded.replace('%D',db.latest_date));
    runPending();
    if(urlQ){ask(urlQ);urlQ=null;}
  }).catch(function(){
    if(db){setStatus(I18N.si.offline.replace('%D',db.latest_date),'warn');runPending();}
    else{loadFailed=true;setStatus(I18N.si.fail,'err');addMsg('bot','<p>'+I18N.si.fail+'</p>');pending=null;}
  });
})();
</script>
