name: Update price data
on:
  schedule:
    # Runs 3x daily (Sri Lanka time = UTC + 5:30)
    - cron: "20 8 * * *"    # 1:50 PM Sri Lanka time
    - cron: "30 11 * * *"   # 5:00 PM Sri Lanka time
    - cron: "20 14 * * *"   # 7:50 PM Sri Lanka time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── CBSL Retail Prices ──────────────────────────────────
      - name: Fetch latest CBSL report and rebuild data.json
        run: python update.py

      - name: Commit CBSL data if changed
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.json pdfs/ || true
          if git diff --staged --quiet; then
            echo "No CBSL changes today."
          else
            git commit -m "Auto-update CBSL price data ($(date +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin main
          fi

      # ── HARTI Wholesale Prices ──────────────────────────────
      - name: Fetch latest HARTI report
        run: python harti_update.py

      - name: Commit HARTI data if changed
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add harti_data.json harti_pdfs/ || true
          if git diff --staged --quiet; then
            echo "No HARTI changes today."
          else
            git commit -m "Auto-update HARTI wholesale data ($(date +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin main
          fi

      # ── CBSL Daily Economic Indicators ─────────────────────
      - name: Fetch latest DEI report
        run: python dei_update.py

      - name: Commit DEI data if changed
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add dei_data.json dei_pdfs/ || true
          if git diff --staged --quiet; then
            echo "No DEI changes today."
          else
            git commit -m "Auto-update DEI economic data ($(date +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin main
          fi
