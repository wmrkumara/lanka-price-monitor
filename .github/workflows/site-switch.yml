# ONE-TIME: makes the Dambulla DEC page the TopGoviya.lk home page (see site_switch.py).
# Run it once by hand. It refuses to run a second time.

name: Switch home page (one time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Switch
        run: python3 site_switch.py
      - name: Save
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          git commit -m "Home page is now the Dambulla DEC page (old home page kept as retail.html)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 10; done
