name: මගේ වගාව video (Sinhala voice)

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voice: both / thilini (female) / sameera (male)"
        required: true
        default: "both"

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts
      - name: Make the video
        run: python make_mw_video.py "${{ github.event.inputs.voice }}"
      - name: Save the video
        uses: actions/upload-artifact@v4
        with:
          name: mage-wagawa-video
          path: mw_out/*.mp4
          retention-days: 14
