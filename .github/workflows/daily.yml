name: Update price data
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch latest reports and rebuild data.json
        run: python update.py
      - name: Commit if data changed
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.json pdfs/ || true
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Auto-update price data ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
