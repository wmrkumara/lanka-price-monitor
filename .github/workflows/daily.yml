name: Update price data
on:
  schedule:
    # 5:00 PM Sri Lanka time = 11:30 UTC daily
    - cron: "30 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest CBSL report and rebuild data.json
        run: python update.py

      - name: Commit if data changed
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.json pdfs/ || true
          if git diff --staged --quiet; then
            echo "No CBSL changes today."
          else
            git commit -m "Auto-update CBSL price data ($(date +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin main
          fi
