# One-time robot: changes the contact button icon to WhatsApp on every page.
name: WhatsApp contact icon (one time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Change the icon
        run: python3 fix_whatsapp_icon.py
      - name: Save
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to change."
          else
            git commit -m "Contact button: WhatsApp icon"
            git pull --rebase origin main
            git push origin main
          fi
