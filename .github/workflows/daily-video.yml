# TopGoviya.lk — daily Dambulla price video (silent, ~2 minutes) + thumbnail + YouTube text
# Runs after "Update price data", or by hand with the Run workflow button.
# Download: Actions → Daily price video → top green run → F5 → Artifacts.
name: Daily price video

on:
  workflow_run:
    workflows: ["Update price data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 libharfbuzz0b
          mkdir -p ~/.fonts
          curl -sL -o ~/.fonts/NotoSansSinhala.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssinhala/NotoSansSinhala%5Bwdth,wght%5D.ttf"
          curl -sL -o ~/.fonts/JetBrainsMono.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          pip install -q pillow

      - name: Make the video
        id: make
        run: |
          python3 make_daily_video.py
          echo "day=$(python3 -c "import json;print(json.load(open('data.json'))['dates'][-1])")" >> "$GITHUB_OUTPUT"

      - name: Save for download
        uses: actions/upload-artifact@v4
        with:
          name: topgoviya-daily-video-${{ steps.make.outputs.day }}
          path: |
            daily_video/*.mp4
            daily_video/*.png
            daily_video/*.txt
          retention-days: 7
