# File: .github/workflows/dea_weekly.yml
# Upload to .github/workflows/ folder in your GitHub repo
#
# Runs automatically every Tuesday, Wednesday and Friday
# at 5:00 PM Sri Lanka time (11:30 UTC)
#
# Tuesday  → DEA publishes new data
# Wednesday → Safety net if DEA published late Tuesday
# Friday    → Final check to confirm week's data is captured
#
# Script does NOTHING if data already exists — safe to run multiple times

name: DEA Spice Prices Weekly Update

on:
  schedule:
    - cron: '30 11 * * 2'   # Tuesday   5:00 PM Sri Lanka
    - cron: '30 11 * * 3'   # Wednesday 5:00 PM Sri Lanka
    - cron: '30 11 * * 5'   # Friday    5:00 PM Sri Lanka
  workflow_dispatch:          # Also allows manual run anytime

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run DEA weekly update
        run: python3 dea_update.py

      - name: Commit dea_data.json if updated
        run: |
          git config user.name "TopGoviya Bot"
          git config user.email "bot@topgoviya.lk"
          git add dea_data.json
          git diff --staged --quiet || git commit -m "DEA spice prices updated $(date +'%d %B %Y')"
          git push
