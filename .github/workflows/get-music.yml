name: Get Shorts Music (one time)

# Downloads the original background tracks (made with vidIQ) into the music/ folder.
# Run by hand (Run workflow) whenever a new track is added below. Tracks already saved are skipped.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download the tracks
        run: |
          mkdir -p music
          B="https://ai-music-tracks.s3.us-east-1.amazonaws.com/fb1e06be-b76c-480e-86c1-e3fe9c7c199b"
          get() { [ -f "music/$2" ] && echo "have $2" || curl -fsSL "$B/$1.wav" -o "music/$2"; }
          get 96dc74a0-6009-4ef5-9fb6-bb3024738fa3 music-1.wav   # Hopeful morning  - vegetable retail, HARTI
          get c5bc2e37-303c-4f2e-b803-16a20aa13f64 music-2.wav   # Calm market      - vegetable wholesale
          get 8e61f963-c1bf-4864-a721-da1002091cb3 music-4.wav   # Green hill garden - tea
          get 2425a6f8-3b78-49f2-a32b-5fd07da74c2e music-5.wav   # Spice garden     - spice roundup, spice cards
          ls -lh music/

      - name: Save them to the repo
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add music/*.wav
          git commit -m "Add Shorts background music" || echo "Nothing new"
          git pull --rebase
          git push
