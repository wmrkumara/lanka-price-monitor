name: Tea Board Monthly Prices

on:
  schedule:
    # Checks every Saturday 9:00 AM Sri Lanka time (03:30 UTC).
    # Tea Board posts monthly data; weekly checking catches it within a week.
    - cron: '30 3 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Tea Board sub-district prices
        run: python tea_update.py

      - name: Save to GitHub (only if new data)
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add tea_price_data.json
          if git diff --cached --quiet; then
            echo "No new tea data - nothing to save"
          else
            git commit -m "Tea Board prices update"
            git pull --rebase
            git push
          fi
