name: Apply manual DEC prices
on:
  push:
    branches: [main]
    paths: ["dec_manual_prices.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-pages
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Add manual DEC prices to market history
        run: python apply_dec_prices.py

      - name: Rebuild market pages
        run: python build_market_pages.py

      - name: Commit if pages changed
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add harti_market_history.json market/ sitemap.xml || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Manual DEC prices applied ($(date +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin main
          fi
