# File: .github/workflows/dea_backfill.yml
# Upload to .github/workflows/ folder
# Run ONCE manually: Actions → DEA Spice Backfill → Run workflow
# Fetches 533 weekly pages 2016→2026 (~25 mins)

name: DEA Spice Backfill (Run Once)

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: 'Backfill from year (default 2016)'
        required: false
        default: '2016'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run DEA backfill
        run: python3 dea_backfill.py --from-year ${{ github.event.inputs.from_year }}

      - name: Commit dea_data.json
        run: |
          git config user.name "TopGoviya Bot"
          git config user.email "bot@topgoviya.lk"
          git add dea_data.json
          git diff --staged --quiet || git commit -m "DEA backfill: 533 weekly spice prices 2016-2026"
          git push
