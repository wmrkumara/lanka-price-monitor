name: Backfill history
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of history to load (365 = one year)"
        default: "365"
        required: true
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backfill
        run: |
          END=$(date -u +%Y-%m-%d)
          START=$(date -u -d "${{ github.event.inputs.days }} days ago" +%Y-%m-%d)
          echo "Backfilling $START to $END"
          python backfill.py "$START" "$END"
      - name: Commit history
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.json pdfs/ || true
          if git diff --staged --quiet; then
            echo "No new data."
          else
            git commit -m "Backfill history ($(date -u +%Y-%m-%d))"
            git push
          fi
