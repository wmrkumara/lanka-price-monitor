name: Backfill history
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of history to load (365 = one year)"
        default: "365"
        required: true
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backfill
        run: |
          END=$(date -u +%Y-%m-%d)
          START=$(date -u -d "${{ github.event.inputs.days }} days ago" +%Y-%m-%d)
          echo "Backfilling $START to $END"
          python backfill.py "$START" "$END"
      - name: Commit history
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.json pdfs/ || true
          if git diff --staged --quiet; then
            echo "No new data."
          else
            git commit -m "Backfill history ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
      # ── Rebuild pages so the site shows the new data straight away ──
      - name: Rebuild price pages and market pages
        run: |
          python build_pages.py
          python update_index.py
          python build_market_pages.py
      - name: Commit pages if changed
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add price/ market/ sitemap.xml harti_market_history.json index.html || true
          if git diff --staged --quiet; then
            echo "No page changes."
          else
            git commit -m "Rebuild pages after backfill ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin main
          fi
