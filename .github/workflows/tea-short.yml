# TopGoviya.lk — Monthly TEA price Short (Sri Lanka Tea Board, made tea auction prices)
# Runs after "Tea Board Monthly Prices" brings a new month, or by hand (Run workflow).
# Download: Actions → Monthly Tea Short → latest run → Artifacts → ready-to-post folder.

name: Monthly Tea Short

on:
  workflow_run:
    workflows: ["Tea Board Monthly Prices"]
    types: [completed]
  workflow_dispatch:

jobs:
  tea-short:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install video tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji
          mkdir -p ~/.fonts
          curl -sL -o ~/.fonts/NotoSansSinhala.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssinhala/NotoSansSinhala%5Bwdth,wght%5D.ttf"
          curl -sL -o ~/.fonts/JetBrainsMono.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          fc-cache -f
          pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Make the video
        run: python3 make_tea_short.py tea_price_data.json icon-512x512.png

      - name: Find the month
        id: tag
        run: echo "month=$(python3 -c "import json;print(json.load(open('tea_price_data.json'))['latestMonth'])")" >> $GITHUB_OUTPUT

      - name: Save video for download
        uses: actions/upload-artifact@v4
        with:
          name: topgoviya-tea-short-${{ steps.tag.outputs.month }}
          path: short/
          retention-days: 30
