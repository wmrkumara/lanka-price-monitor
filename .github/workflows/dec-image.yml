# TopGoviya.lk — link preview image for the Dambulla DEC page (home page)
# Runs after each "Dambulla DEC prices" run and only redraws when there is a new day.
# Image: https://topgoviya.lk/share/dambulla-wide.png

name: Dambulla preview image

on:
  workflow_run:
    workflows: ["Dambulla DEC prices"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dambulla-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Is there a new day?
        id: check
        run: python3 make_dec_image.py --check >> "$GITHUB_OUTPUT"

      - name: Install fonts and browser
        if: steps.check.outputs.need == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji
          mkdir -p ~/.fonts
          curl -sL -o ~/.fonts/NotoSansSinhala.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssinhala/NotoSansSinhala%5Bwdth,wght%5D.ttf"
          curl -sL -o ~/.fonts/JetBrainsMono.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          fc-cache -f
          pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Make the image
        if: steps.check.outputs.need == 'yes' || github.event_name == 'workflow_dispatch'
        run: python3 make_dec_image.py

      - name: Make the item pages (dambulla/<item>.html)
        if: steps.check.outputs.need == 'yes' || github.event_name == 'workflow_dispatch'
        run: python3 make_dambulla_pages.py

      - name: Save the image
        if: steps.check.outputs.need == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add share/ dambulla/ index.html dambulla.html dambulla-fruit-price.html sitemap.xml || true
          if git diff --staged --quiet; then
            echo "No new image."
          else
            git commit -m "Dambulla preview image ($(TZ=Asia/Colombo date +%Y-%m-%d))"
            for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 10; done
          fi
